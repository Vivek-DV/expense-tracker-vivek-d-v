<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            
            <div>
                <h1>Finzo</h1>
                <p>Manage Today. Plan Tomorrow</p>
            </div>
        </header>

        <!-- Summary Cards -->
        <section class="summary">

            <div class="summary-card income-card">
                <div class="card-icon">↗</div>
                <div>
                    <p>Total Income</p>
                    <h2 id="totalIncome">₹0.00</h2>
                </div>
            </div>

            <div class="summary-card expense-card">
                <div class="card-icon">↘</div>
                <div>
                    <p>Total Expenses</p>
                    <h2 id="totalExpense">₹0.00</h2>
                </div>
            </div>

            <div class="summary-card balance-card">
                <div class="card-icon">₹</div>
                <div>
                    <p>Current Balance</p>
                    <h2 id="balance">₹0.00</h2>
                </div>
            </div>

        </section>

        <!-- Main Content -->
        <div class="main-grid">

            <!-- Add Transaction -->
            <section class="form-section">

                <h2 id="formTitle">Add Transaction</h2>

                <form id="transactionForm">

                    <div class="form-group">
                        <label for="type">Transaction Type</label>

                        <div class="type-buttons">
                            <button
                                type="button"
                                class="type-btn active income-btn"
                                data-type="income">
                                Income
                            </button>

                            <button
                                type="button"
                                class="type-btn expense-btn"
                                data-type="expense">
                                Expense
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input
                            type="number"
                            id="amount"
                            placeholder="Enter amount"
                            min="0"
                            step="0.01"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>

                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Education">Education</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input
                            type="date"
                            id="date"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            rows="3"
                            placeholder="Enter description"></textarea>
                    </div>

                    <div class="form-actions">

                        <button
                            type="submit"
                            class="submit-btn"
                            id="submitBtn">
                            Add Transaction
                        </button>

                        <button
                            type="button"
                            class="cancel-btn"
                            id="cancelBtn"
                            style="display: none;">
                            Cancel
                        </button>

                    </div>

                </form>

            </section>

            <!-- Transactions -->
            <section class="transactions-section">

                <div class="transaction-header">

                    <div>
                        <h2>Transactions</h2>
                        <p id="transactionCount">0 transactions</p>
                    </div>

                </div>

                <!-- Filters -->
                <div class="filters">

                    <select id="typeFilter">
                        <option value="all">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>

                    <select id="categoryFilter">
                        <option value="all">All Categories</option>
                        <option value="Salary">Salary</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Education">Education</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>

                </div>

                <!-- Transaction List -->
                <div id="transactionList" class="transaction-list">

                    <div class="empty-state">
                        <div class="empty-icon">₹</div>
                        <h3>No transactions yet</h3>
                        <p>Add your first transaction to get started.</p>
                    </div>

                </div>

            </section>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
